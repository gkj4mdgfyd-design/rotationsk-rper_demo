<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vokabeltrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <h1>Vokabeltrainer</h1>
  <span class="sub" id="header-sub">Vokabeln &amp; Fachbegriffe lernen</span>
  <nav id="top-nav" class="hidden">
    <button class="nav-btn" data-view="dashboard">Stapel</button>
    <span class="user-email" id="user-email"></span>
    <button class="nav-btn ghost" id="logout-btn">Abmelden</button>
  </nav>
</header>

<main id="app"></main>

<template id="tpl-auth">
  <section class="panel narrow">
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Anmelden</button>
      <button class="tab-btn" data-tab="register">Registrieren</button>
    </div>
    <form id="auth-form" class="stack">
      <label>E-Mail
        <input type="email" name="email" required autocomplete="username">
      </label>
      <label>Passwort
        <input type="password" name="password" required autocomplete="current-password" minlength="8">
      </label>
      <p class="hint">Mindestens 8 Zeichen.</p>
      <button type="submit" class="btn primary">Anmelden</button>
      <p class="error" id="auth-error"></p>
    </form>
  </section>
</template>

<template id="tpl-dashboard">
  <section class="panel">
    <div class="panel-head">
      <h2>Deine Lernstapel</h2>
      <button class="btn primary" id="new-deck-btn">+ Neuer Stapel</button>
    </div>
    <div id="deck-list" class="deck-grid"></div>
  </section>
</template>

<template id="tpl-deck">
  <section class="panel">
    <div class="panel-head">
      <div>
        <button class="btn ghost small" data-view="dashboard">&larr; Zurueck</button>
        <h2 id="deck-name"></h2>
        <p class="muted" id="deck-desc"></p>
      </div>
      <div class="btn-row">
        <button class="btn" id="deck-import-btn">Foto/PDF importieren</button>
        <button class="btn" id="deck-add-btn">Karte hinzufuegen</button>
      </div>
    </div>

    <div class="stats-strip" id="deck-stats"></div>

    <div class="btn-row study-row">
      <button class="btn primary" id="start-flashcard-btn">Karteikarten lernen</button>
      <button class="btn primary" id="start-typing-btn">Tipp-Training</button>
      <label class="direction-toggle">
        Richtung:
        <select id="study-direction">
          <option value="term-definition">Begriff &rarr; Erklaerung</option>
          <option value="definition-term">Erklaerung &rarr; Begriff</option>
        </select>
      </label>
    </div>

    <h3>Karten (<span id="card-count">0</span>)</h3>
    <div id="card-list" class="card-table"></div>
  </section>
</template>

<template id="tpl-import">
  <section class="panel">
    <button class="btn ghost small" id="import-back-btn">&larr; Zurueck zum Stapel</button>
    <h2>Foto oder PDF importieren</h2>
    <p class="muted">Lade ein Foto (JPG/PNG) oder ein PDF deiner Vokabelliste oder Mitschrift hoch. Der Text wird automatisch erkannt (Texterkennung/OCR) und in Begriff-Erklaerung-Paare aufgeteilt, wenn die Zeile ein Trennzeichen wie "-", "=", ":" oder Tabulator enthaelt. Das Ergebnis kannst du danach pruefen und bearbeiten. Am besten funktioniert das bei Listen mit einem Begriffspaar pro Zeile.</p>

    <div class="upload-box" id="upload-box">
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" hidden>
      <button class="btn primary" id="pick-file-btn">Datei auswaehlen</button>
      <span id="file-name" class="muted"></span>
    </div>
    <p class="error" id="import-error"></p>
    <div id="import-loading" class="hidden loading-row">
      <div class="spinner"></div> Text wird erkannt ...
    </div>

    <div id="import-review" class="hidden">
      <h3>Gefundene Begriffe (<span id="import-count">0</span>) &mdash; bitte pruefen</h3>
      <div id="import-items" class="import-list"></div>
      <div class="btn-row">
        <button class="btn primary" id="import-save-btn">Ausgewaehlte Karten speichern</button>
      </div>
    </div>
  </section>
</template>

<template id="tpl-study">
  <section class="panel narrow">
    <button class="btn ghost small" id="study-back-btn">&larr; Abbrechen</button>
    <div class="study-progress">
      <div class="progress-bar"><div class="progress-fill" id="study-progress-fill"></div></div>
      <span id="study-progress-text" class="muted"></span>
    </div>

    <div id="study-empty" class="hidden">
      <p>Keine faelligen Karten &mdash; du bist auf dem aktuellen Stand. Komm spaeter wieder!</p>
    </div>

    <div id="study-flashcard" class="hidden">
      <div class="flip-card" id="flip-card">
        <div class="flip-card-inner" id="flip-card-inner">
          <div class="flip-face front" id="fc-front"></div>
          <div class="flip-face back" id="fc-back"></div>
        </div>
      </div>
      <p class="hint" id="fc-hint">Karte antippen zum Umdrehen</p>
      <div class="btn-row rate-row hidden" id="rate-row">
        <button class="btn rate again" data-rating="again">Nochmal</button>
        <button class="btn rate hard" data-rating="hard">Schwer</button>
        <button class="btn rate good" data-rating="good">Gut</button>
        <button class="btn rate easy" data-rating="easy">Leicht</button>
      </div>
    </div>

    <div id="study-typing" class="hidden">
      <div class="prompt-card" id="typing-prompt"></div>
      <form id="typing-form" class="stack">
        <input type="text" id="typing-input" autocomplete="off" placeholder="Antwort eingeben ..." autofocus>
        <button type="submit" class="btn primary">Pruefen</button>
      </form>
      <div id="typing-feedback" class="feedback hidden"></div>
      <button class="btn primary hidden" id="typing-next-btn">Weiter</button>
    </div>
  </section>
</template>

<script type="module" src="/js/app.js"></script>
</body>
</html>
